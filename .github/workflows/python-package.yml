# Unit tests + lint. Only the integration test needs the (cached) template bank.
name: Unit Test NGSF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check --output-format=github .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          # NGSF_version reads `git describe`, so the tests need history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # setup-uv already made .venv and exported VIRTUAL_ENV; --clear keeps this
      # correct either way. Not --system: its interpreter is externally managed.
      - run: uv venv --clear
      - run: uv pip install ".[test]"

      # Keyed on the URL alone: the bank is a fixed published archive.
      - name: Cache template bank
        id: bank
        uses: actions/cache@v4
        with:
          path: bank
          key: ngsf-bank-supyfit-v1

      - name: Test
        env:
          MPLBACKEND: Agg
          # The bank is mirrored now, so an unavailable bank is a real failure —
          # without this a green run can mean the fit never ran.
          NGSF_REQUIRE_INTEGRATION: "1"
        run: .venv/bin/pytest -v --cov=NGSF --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
