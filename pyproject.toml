[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NGSF"
version = "0.0.1"
description = "Next Generation SuperFit in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Samantha Goldwasser" },
    { name = "Ofer Yaron", email = "ofer.yaron@weizmann.ac.il" },
    { name = "Avner Sass" },
    { name = "Ido Irani" },
    { name = "Avishay Gal-Yam" },
    { name = "D. Andrew Howell" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "extinction",
    "matplotlib",
    "numpy",
    "pandas",
    "PyAstronomy",
    "scipy",
]

[project.optional-dependencies]
# Only the Fritz scripts need these; the fitter itself does not.
fritz = ["requests", "simplejson", "pillow"]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/samanthagoldwasser25/NGSF"

[tool.setuptools]
# NGSF_version is a top-level module every NGSF module imports, and the modules
# read the default config at import time, so an install without either is broken.
packages = ["NGSF", "NGSF.config"]
py-modules = ["NGSF_version"]

[tool.setuptools.package-dir]
"NGSF.config" = "config"

[tool.setuptools.package-data]
NGSF = ["mjd_of_maximum_brightness.csv", ".version"]
"NGSF.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["NGSF/tests"]
# NGSF_version lives at the repo root, so it has to be importable from a source
# checkout however pytest is invoked.
pythonpath = ["."]
markers = [
    "integration: needs the WISeREP template bank (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
extend-exclude = ["SF_class.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    # The science modules bind intermediates that document the algebra.
    "F841",
]

[tool.ruff.lint.per-file-ignores]
# The Fritz helpers are star-imported by download_fit_post.
"fritz_func.py" = ["F403", "F405"]
"download_fit_post.py" = ["F403", "F405"]
